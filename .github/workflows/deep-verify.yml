# The heavy verification the per-push CI deliberately skips, run on a schedule (and on
# demand). Three things the fast lane cannot afford every push:
#   - the exhaustive enumerator's deep sweeps (`#[ignore]`d, millions of reachable states,
#     GBs of RAM) — the bounded-model-checking theorems that are the project's whole point;
#   - a bounded run of every libFuzzer target;
#   - the Tier C Kani preservation proofs (hv-verify) — which, unlike the enumerator, prove
#     invariant preservation over UNBOUNDED refcount magnitudes (installing Kani + its CBMC
#     backend costs a few minutes, so it belongs here, not in the per-PR gate);
#   - the Tier C Verus preservation proofs (hv-verify/verus) — the ∀-N step: preservation over
#     ARBITRARY table size (the scalar↔Vec length axis Kani can only `unwind`).
# A red run here means a reachable state violated an invariant, a fuzzer found a crash, or a
# transition can break an invariant at some refcount or table size — each is a real defect, so
# this workflow is allowed to fail loudly.
name: Deep verification

on:
  schedule:
    # Weekly, Monday 06:17 UTC (offset minute to dodge the top-of-hour scheduler surge).
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: deep-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every `#[ignore]`d exhaustive sweep, in release, serialized (`--test-threads=1`) because
  # each peaks at several GB and running them in parallel would OOM a 16 GB runner. Each sweep
  # reports whether it CLOSED (a complete theorem for its depth) or hit its state cap (a still-
  # clean lower bound) — see hv-sim/src/enumerate.rs.
  exhaustive-sweeps:
    name: exhaustive enumerator sweeps
    runs-on: ubuntu-latest
    # 45 was fine at 30m26s (2026-07-20, the last run that finished) and became a HARD FAILURE as the
    # suite grew: 45m16s / 45m17s / 45m19s across the next three runs, each exactly this wall. Nothing
    # broke — the budget stopped matching the work, which is the same diagnosis this repo already
    # recorded for the Kani gate ("the wall was UNDER-SET, not flaky").
    #
    # 120 is DELIBERATELY GENEROUS rather than a tuned number, and the asymmetry is the argument: this
    # job is weekly and nobody blocks on it, so an over-generous wall costs nothing while a too-tight
    # one costs a SILENT RED — which went unnoticed for two weeks. It is set high enough that a run can
    # finally COMPLETE and report the real CI duration, which no run has ever produced. Tighten it
    # against that measured number (with the CI-vs-local ratio), never against the local number.
    #
    # MEASURED LOCALLY 2026-08-03, `--test-threads=1`, release: 23 tests, 32m52s total, and severely
    # lopsided — `hierarchy_saturates_only_under_symmetry_reduction` alone is 739.8s (37.5%), the top
    # three are 64.5%, and the remaining 18 tests together are 20.5%.
    timeout-minutes: 120
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # ⑳-c: the inventory FIRST — `--list` enumerates without running (~2 s), so a deleted sweep
      # is named here rather than silently reducing the run below. `cargo xtask ci` checks the same
      # thing on every PR; this keeps the weekly job self-contained.
      - name: deep-sweep inventory
        run: cargo xtask sweeps

      # ⚠ RETRACTION (#125 got this wrong): an earlier version of this comment claimed
      # `--test-threads=1` was "for readable `--nocapture` output, not for correctness", and that
      # parallelising was "a live option". Both are false, and the refutation was already thirty
      # lines above at the `exhaustive-sweeps:` job comment, which has said all along that each sweep
      # **peaks at several GB and running them in parallel would OOM a 16 GB runner**. A rationale was
      # invented for a flag that already had a documented one — exactly the second-derivation defect
      # this repo keeps paying for. Read the surrounding file before explaining a line in it.
      #
      # So: serialization is a MEMORY constraint, and parallelising is not a lever — it is the thing
      # the job comment already rules out. The makespan figure is kept only because it bounds what
      # parallelism could ever buy if the memory ceiling were lifted (longest test 12m20s vs the
      # 32m52s sum), NOT as a suggestion. There is nothing to gain regardless: this job is weekly and
      # asynchronous, and it now completes in 68m20s against a 120-minute wall.
      - name: cargo test --release --ignored (deep sweeps)
        run: cargo test --release -p hv-sim -- --ignored --nocapture --test-threads=1

  # Tier C: the Kani preservation proofs in hv-verify. Each proof makes a grant refcount
  # fully symbolic and proves an invariant (`WritableExceedsMaps`) survives a transition for
  # EVERY 2^32 magnitude — the residual Tier B (docs/TIER-B-CUTOFF.md §1.4) could only argue,
  # since an infinite state space cannot be enumerated. The harnesses are `#[cfg(kani)]`-gated,
  # so they exist only under `cargo kani`; a normal build never sees them.
  kani:
    name: kani preservation proofs
    runs-on: ubuntu-latest
    # Kept in lockstep with proofs.yml's `kani proofs (PR)` job, which carries the measurements
    # behind this number — including the two occasions the 45-minute wall killed a run that had
    # not failed a single harness, and the parallelism that fixed it (975 s -> 435 s at `-j 4`).
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Kani is a cargo subcommand plus its own downloaded backend (CBMC). The version is
      # pinned so a Kani release cannot silently change proof semantics — raise it deliberately
      # (mirrors the cargo-deny @0.19.0 pin). `cargo kani setup` fetches the backend once.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier@0.67.0
          cargo kani setup

      # In lockstep with proofs.yml's PR gate, which carries the measurement: `-j 4` (the runner's
      # vCPU count) took the same 65 harnesses from 975 s to 435 s locally, and `--output-format=
      # terse` is what `-j` requires — no diagnostics lost, every per-harness time still printed.
      # ⑳-b: same gate as the REQUIRED `kani proofs (PR)` job, deliberately — a weekly backstop
      # weaker than the PR gate it backs up would let a deleted harness through.
      - name: cargo kani -p hv-verify + harness inventory (preservation proofs)
        run: cargo xtask kani-harnesses

  # Tier C, the ∀-N step: the Verus preservation proofs in hv-verify/verus. Where Kani makes a
  # refcount symbolic and proves over all 2^32 MAGNITUDES on the real code (bounded on Vec
  # length), Verus proves the §3 residuals over ARBITRARY size: RefcountMismatch preserved by
  # grant map/unmap over an arbitrary entry table + mapping sequence (refcount_mismatch.rs), and
  # the projection frame-lemma — the grant summation maps_over_frame(f) is owner-local, so a
  # disjoint transition can't perturb UnbackedGrantMap (frame_lemma.rs) — the scalar↔Vec-length
  # axis Kani would have to `unwind` (docs/TIER-B-CUTOFF.md §2.3/§3, docs/TIER-C-SPIKE.md §4-5).
  # The proofs are a Verus-
  # dialect MIRROR (Verus cannot be #[cfg]-hidden from cargo like the Kani harnesses can), kept
  # outside hv-verify/src so a normal build never sees them; fidelity to the shipped transition
  # is documented in hv-verify/verus/README.md. Verus ships prebuilt (verifier + z3) but drives
  # the pinned rustup toolchain it was built against (installed below); the release is
  # version-pinned so a Verus release cannot silently change proof semantics (mirrors the Kani /
  # cargo-deny pins).
  verus:
    name: verus preservation proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned Verus release. Raise deliberately with a local re-verify, not via Dependabot
      # (Dependabot does not track GitHub-release downloads). Keep in step with the
      # arm64-macos asset documented in hv-verify/verus/README.md.
      VERUS_TAG: release/0.2026.07.12.0b42f4c
      VERUS_ZIP: verus-0.2026.07.12.0b42f4c-x86-linux.zip
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verus's prebuilt driver shells out to rustup for the EXACT toolchain it was built
      # against (1.96.0 for this release) and errors if it is not installed. Conveniently that
      # is our MSRV floor — so, unlike Kani (whose pinned 1.93 nightly sits *below* the floor and
      # forced dropping the manifest gate, see Cargo.toml), Verus's pin is benign: it needs no
      # manifest change, just the floor toolchain present via rustup.
      - name: Install the Verus toolchain (1.96.0 — the MSRV floor)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0

      # Verus is a self-contained prebuilt bundle (verifier + z3); it uses the rustup toolchain
      # installed above for its front-end.
      - name: Install Verus (pinned prebuilt)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/verus.zip \
            "https://github.com/verus-lang/verus/releases/download/${VERUS_TAG}/${VERUS_ZIP}"
          mkdir -p "$HOME/.local/verus"
          unzip -q /tmp/verus.zip -d "$HOME/.local/verus"
          echo "$HOME/.local/verus/verus-x86-linux" >> "$GITHUB_PATH"

      # Verify every proof file in hv-verify/verus/ (RefcountMismatch preservation over
      # arbitrary table size; the projection frame-lemma / grant-summation owner-locality; …) AND
      # check each discharges the number of obligations `xtask`'s VERUS_OBLIGATIONS expects.
      #
      # ⚠ Same gate as the REQUIRED `verus proofs (PR)` job in proofs.yml, deliberately — a weekly
      # backstop weaker than the PR gate would let a deleted proof through on any path that skips
      # the PR job. Exit status alone is blind to a deleted proof: MEASURED, removing `ni_theorem_b`
      # leaves verus reporting `19 verified, 0 errors` and this step green.
      - name: verus proofs + obligation counts (Tier C ∀-N, Tier D)
        run: cargo xtask verus-counts

  # A bounded run of every fuzz target on nightly. No persisted corpus yet, so this is a
  # continuous smoke-fuzz (regression catcher), not a deep campaign — still far better than
  # the targets only ever being compile-checked.
  fuzz:
    name: fuzz (persisted corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: hv-fuzz

      # Persist the coverage corpus across runs — the point of a fuzzing *campaign* vs a
      # from-scratch smoke test. The key is unique per run (so the post-job save always writes
      # a fresh entry), and `restore-keys` pulls the most recent prior corpus, so each weekly
      # run builds on every earlier run's coverage instead of restarting from zero. cargo-fuzz
      # keeps the corpus at `hv-fuzz/corpus/<target>` (the `--fuzz-dir` root).
      - name: Restore the fuzzing corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hv-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # Two layout/toolchain notes baked into the invocation:
      #  - hv-fuzz is a *flattened* cargo-fuzz project (it IS the fuzz crate, not the
      #    conventional `<crate>/fuzz/` nested layout), so point cargo-fuzz at it with
      #    `--fuzz-dir hv-fuzz` from the repo root rather than the `./fuzz` default; and
      #  - cargo-fuzz defaults to the musl (statically-linked libc) target on Linux, which
      #    AddressSanitizer cannot instrument ("sanitizer is incompatible with statically
      #    linked libc"), so force the gnu target (dynamic libc, the runner's host std).
      # Each target runs 180s, then `cmin` minimizes its corpus so coverage accumulates
      # without unbounded growth in the cache.
      - name: fuzz each target (build on the persisted corpus)
        run: |
          set -euo pipefail
          for target in decode evtchn grant sched policy hypervisor p2m; do
            echo "::group::fuzz $target"
            cargo fuzz run --fuzz-dir hv-fuzz --target x86_64-unknown-linux-gnu \
              "$target" -- -max_total_time=180 -rss_limit_mb=4096
            cargo fuzz cmin --fuzz-dir hv-fuzz --target x86_64-unknown-linux-gnu "$target"
            echo "::endgroup::"
          done

  # ─── the backstop's own backstop ─────────────────────────────────────────────────────────────────
  #
  # Deep verification is schedule-only and NOT required, so a failure blocks no merge and pages no
  # one. It was RED FOR TWO WEEKS (2026-07-27 → 2026-08-03) before anyone noticed, and it turned out
  # to be broken in TWO independent ways — a fuzz-harness false positive (#124) and this file's own
  # sweeps wall (#125), the second only visible once the first was fixed.
  #
  # ⚠ THE OBVIOUS FIX WAS ALREADY IN PLACE AND HAD ALREADY FAILED. `README.md` carries this
  # workflow's badge at the top of the repo front page — the page most looked at — and it showed red
  # the entire time. "Put the signal where it will be seen" is not untried; it is refuted. An
  # always-present indicator habituates: green and red occupy the same pixels in the same place, and
  # the eye stops resolving it.
  #
  # So this job does not add another indicator. It changes the ISSUE COUNT, 0 → 1 — a new element
  # appearing on a page already loaded, rather than an existing one changing colour. Different visual
  # channel, and it PERSISTS: an issue has state that outlives a missed glance, and answers "is there
  # an open one?" instead of "did I see it three weeks ago?".
  #
  # Uses the preinstalled `gh` rather than an action, deliberately: no new third-party dependency to
  # pin, audit or trust for a job whose whole purpose is to be trustworthy when everything else is red.
  report-red:
    name: report a red backstop
    needs: [exhaustive-sweeps, kani, verus, fuzz]
    # `cancelled` is caught alongside `failure` because that is exactly how this went wrong: the Kani
    # job died as a CANCEL (an external runner kill mid-harness, no proof failing), and a condition
    # matching only `failure()` would have stayed silent for the case that motivated this job.
    # Parens are load-bearing — `&&` binds tighter than `||` in GitHub expressions.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped HERE, not at the workflow level: a job-level block replaces the default outright, so the
    # write scope exists for this job alone and every other job keeps `contents: read`.
    permissions:
      issues: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          red=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "- `\(.key)` → **\(.value.result)**"')

          # Belt AND braces. The `if:` above already keeps this job from running on an all-green run,
          # but that is ONE condition standing between a green run and an issue titled "Deep
          # verification is red" listing nothing. A reporter that cries wolf is the failure mode that
          # kills reporters — 52 spurious issues a year and you stop reading them, which is the
          # problem this job exists to solve. Caught by dry-running the script rather than by reading
          # it: with every job green it happily composed the issue.
          if [ -z "$red" ]; then
            echo "no red jobs — nothing to report (the workflow-level \`if:\` should have prevented this)"
            exit 0
          fi

          body=$(cat <<EOF
          \`Deep verification\` finished with a red job on \`${GITHUB_SHA}\`.

          $red

          Run: $RUN_URL

          ---
          **Red here means "go look", not "something is broken".** Two of the three reds seen so far
          were NOT defects: a fuzz harness reporting an out-of-domain state as a violation (#124), and
          a runner killing the Kani job mid-harness with every completed proof passing. Read the log
          before concluding — and note the Kani proofs are separately gated as a REQUIRED PR check, so
          a red here is a coverage gap rather than an unverified diamond.

          Close this once the run is understood; it will reopen on the next red rather than nag.
          EOF
          )

          # The label may not exist yet, and `gh issue create --label` fails on an unknown one.
          gh label create deep-verify-red --color B60205 \
            --description "Deep verification finished red — read the run before concluding" \
            >/dev/null 2>&1 || true

          existing=$(gh issue list --label deep-verify-red --state open --limit 1 --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            # Comment rather than open a second one: a weekly job that opens an issue per failure
            # produces 52 a year and teaches you to ignore them, which is the original problem again.
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Deep verification is red" --label deep-verify-red --body "$body"
          fi
