name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the checkout. No job writes contents,
# issues, packages, or deployments, so a compromised action or dependency cannot use
# the workflow token to mutate the repo. Any future job needing more elevates itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a full commit SHA (the tag in the comment is for
# humans and for Dependabot, which bumps the SHA via reviewed PRs — see
# .github/dependabot.yml). A moved tag cannot silently change what runs in CI.
#
# Every job starts with step-security/harden-runner in `audit` mode: it monitors and logs
# the runner's network egress (so a compromised action phoning home is visible in the run's
# security insights) without blocking anything — a mis-scoped allow-list therefore cannot
# redden CI. Once the observed egress is known, this can be tightened to `egress-policy: block`
# with an explicit `allowed-endpoints` list. Pairs with the SHA-pinning: pinning fixes *what*
# runs, harden-runner watches *what it talks to*.
jobs:
  ci:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The single source of truth for "green": the same bar `cargo xtask ci`
      # enforces locally — rustfmt --check, clippy -D warnings, then the tests.
      - name: cargo xtask ci
        run: cargo xtask ci

  # Compile-check the standalone fuzz crate so a broken target is caught in CI,
  # without spending wall-clock actually fuzzing on every push (the scheduled
  # deep-verify workflow runs the fuzzers).
  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: hv-fuzz

      - name: cargo check (hv-fuzz)
        working-directory: hv-fuzz
        run: cargo check --all-targets

  # Machine-check the hypercall-vocabulary count with FIRST-PARTY rustc only. `hv-core` keeps its
  # `HVCALL_VARIANT_COUNT` as a hand-written const so the verified core carries zero external
  # dependencies (no proc-macro toolchain in its build). This job proves that const equals the true
  # number of `HvCall` variants via the nightly `core::mem::variant_count` intrinsic — the sole
  # place the completeness census's count is mechanically pinned, at PR time, without adding any
  # third-party trust. See `hv-core`'s `HVCALL_VARIANT_COUNT` docs.
  variant-count:
    name: HvCall variant count (first-party)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: variant_count assertion (nightly, first-party)
        run: cargo test -p hv-core --features variant_count_check hvcall_variant_count_is_current

  # Metal boot smoke-test (M3): build the standalone bare-metal `hv-metal` binary for
  # `aarch64-unknown-none-softfloat` and boot it on the QEMU `virt` machine at EL2. As of Arc 2 it
  # asserts the serial markers for the alive banner, `CurrentEL = EL2`, and — in the `--features
  # selftest` build — that the installed exception vectors CATCH and DECODE a deliberate `BRK`
  # (`EC=0x3c`). This is the metal side of the "diamond -> CI-green -> merge" loop — every later
  # metal arc rides this check. `hv-metal` is excluded from the workspace (it cannot link for the
  # host), so it is built + booted out-of-band via `cargo xtask qemu-test`. Functional refinement
  # only — see docs/QEMU-AND-METAL.md for what an emulated run does and does not attest.
  metal-boot:
    name: metal boot (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable toolchain + bare-metal target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: hv-metal

      # `qemu-system-arm` provides `qemu-system-aarch64` on Ubuntu.
      - name: Install QEMU (AArch64 system emulation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm

      # hv-metal is excluded from the workspace, so the `fmt · clippy · test` job never lints it —
      # yet it is the one crate carrying `unsafe`. Gate it here under the same `-D warnings` bar.
      - name: Lint hv-metal (fmt --check + clippy -D warnings, both feature configs)
        run: cargo xtask metal-lint

      - name: hv-metal boots to the serial markers under QEMU
        run: cargo xtask qemu-test

  # The REAL-Linux boot (M5 Arc 5e / Arc 6b), gated. An unmodified Alpine aarch64 kernel boots as an
  # EL1 guest behind the PROVEN Stage-2 emitter, reaches userspace out of its initramfs, and powers
  # off through hv-metal's PSCI handler — the one guest in this repository that is not synthetic.
  #
  # Why this job exists, stated honestly: it carries NO isolation content. The thesis is proven on the
  # un-forgeable synthetic guests (`metal boot (QEMU)`, above), and this arc only demonstrates that the
  # already-proven interface carries a real kernel. It was deferred for arcs for exactly that reason.
  # What it buys is that the demonstration becomes RE-RUNNABLE BY ANYONE rather than a result from one
  # laptop — which is also what the two-real-guests capstone will need, or it would land the same way.
  #
  # WHAT IT ASSERTS, and why the assertions could fail. `cargo xtask qemu-linux-test` runs the same
  # QEMU line as the `qemu-linux` demo (one derivation — see `linux_qemu_args`) with the serial output
  # captured, and requires every marker in `LINUX_MARKERS` and none in `LINUX_FORBIDDEN`. Those lists
  # carry the reasoning per marker; the two loudest are `node 0: [mem 0x48000000-0x7fffffff]` (the
  # kernel reporting the RAM window it got from our DTB, which must equal what the emitter mapped and
  # where xtask's `-device loader` put the blobs — four places, one string) and the FORBIDDEN
  # `LINUX GUEST TRAP`, which `handle_linux_sync` prints for any Stage-2 abort, so an emitter
  # mis-mapping lands there. Probed load-bearing before this job was written: nine mutations (DTB
  # /memory base, the emitted RAM window, the device window, the initramfs load address, the kernel
  # entry, read-only RAM leaves, the wait cap, absent artifacts, a flipped checksum pin), nine red.
  #
  # WHERE THE KERNEL COMES FROM. Not committed (40 MB of binaries would make git history the trust
  # base) and not a release asset (which needs the regeneration recipe documented anyway, so it is the
  # recipe plus a hosting step). `hv-metal/linux/fetch-guest-image.sh` builds both artifacts from two
  # VERSION-PINNED official Alpine URLs, each verified against a SHA-256 in the script, and unwraps the
  # EFI-zboot `vmlinuz-virt` into the raw arm64 `Image` the boot protocol wants. So what this job
  # trusts is two fixed 256-bit hashes: `dl-cdn.alpinelinux.org` is an AVAILABILITY dependency, not a
  # TRUST dependency — the same posture as the SHA-pinned actions above. The script is also what
  # populates a developer's `$BALEEN_LINUX_DIR`, so there is one recipe, not a workflow copy of one.
  #
  # THE FAILURE MODE THIS ACCEPTS. As a required check, a dl-cdn outage blocks merges. That is the
  # price of the alternative being decorative — an advisory job makes the capstone barely count. The
  # cache below makes an outage a days-wide window rather than an instant one. What is deliberately
  # NOT done is letting a fetch failure pass green: a job that goes green when it could not obtain the
  # kernel would stay green if the kernel were deleted.
  real-linux-boot:
    name: real-linux boot (QEMU)
    runs-on: ubuntu-latest
    # A real kernel under cross-arch TCG. Locally (native-arch TCG, M4 Pro) the whole task is 2.3 s
    # including the incremental build and dtc; the runner is slower and this budget is deliberately
    # loose, since the cost of a tight cap on a REQUIRED gate is intermittent redness. The inner wait
    # cap (`LINUX_WAIT_SECS_DEFAULT`, 300 s) is what actually decides a hung boot, and it reports the
    # serial log; this timeout is only the backstop.
    timeout-minutes: 25
    env:
      BALEEN_LINUX_DIR: ${{ github.workspace }}/.baleen-linux
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable toolchain + bare-metal target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: hv-metal

      # `qemu-system-arm` provides `qemu-system-aarch64`; `device-tree-compiler` provides `dtc`, which
      # xtask shells out to for the guest DTB; `cpio` builds the initramfs.
      - name: Install QEMU, dtc and cpio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm device-tree-compiler cpio

      # Keyed on the recipe itself — both scripts, whose contents include every pinned hash — so
      # changing a pin necessarily changes the key and cannot be satisfied by a stale entry. The
      # script re-verifies the restored `Image` against `IMAGE_SHA256` regardless, so a cache hit is
      # checked rather than believed.
      - name: Cache the guest kernel + initramfs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.baleen-linux
          key: baleen-linux-guest-${{ hashFiles('hv-metal/linux/fetch-guest-image.sh', 'hv-metal/linux/guest-init.sh') }}

      # A separate step from the boot so a mirror outage is diagnosable at a glance as a fetch
      # failure, rather than looking like the hypervisor broke.
      - name: Fetch the guest kernel + initramfs (checksum-pinned)
        run: hv-metal/linux/fetch-guest-image.sh

      - name: A real Linux kernel boots behind the proven emitter
        run: cargo xtask qemu-linux-test

  # Supply-chain gate: refuse a dependency carrying a security advisory, a disallowed
  # license, an untrusted source, or a wildcard version. The shipping workspace has zero
  # external deps today, so this stays green now and blocks the first bad dep from landing
  # unreviewed. cargo-deny's advisory check subsumes cargo-audit (same RustSec database).
  # Covers both manifests: the workspace AND the standalone hv-fuzz crate (where the only
  # real third-party code — libFuzzer and its deps — actually lives).
  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          # Pin the tool version so CI matches what is validated locally; a CLI change in a
          # newer cargo-deny cannot silently break this job. Dependabot does not bump this
          # (it is a tool, not a dependency) — raise it deliberately alongside a local re-check.
          tool: cargo-deny@0.19.0

      - name: cargo-deny (workspace)
        run: cargo deny check

      - name: cargo-deny (hv-fuzz)
        working-directory: hv-fuzz
        run: cargo deny check --config ../deny.toml

  # Enforce the MSRV: the code must compile on the 1.96 floor, so the promise cannot silently
  # rot as newer std APIs tempt their way in. This job is the *single source* of MSRV
  # enforcement — the workspace manifest deliberately omits the `rust-version` gate so Kani's
  # pinned (older) toolchain can build the libraries for the Tier C proofs (see the note in
  # Cargo.toml). The `1.96` here is therefore the MSRV definition; raise both together. A
  # `check` (not a full test run) is the contract — the stable `ci` job above runs the tests.
  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # No `--locked`: Cargo.lock is gitignored (a zero-external-dep library workspace), so
      # there is nothing to lock against — the resolver builds a trivial graph of path crates.
      - name: cargo check on the MSRV floor
        run: cargo check --workspace --all-targets
