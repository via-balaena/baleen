[package]
name = "hv-metal"
description = "Bare-metal binary: boot, enter EL2, the thin fenced `unsafe` core. The southbound metal layer beneath the proven `hv-core` brain."
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Via Balaena"]
publish = false

[features]
# `selftest` turns the boot into a self-checking run: it asserts the synthetic `HvCall` dispatched
# into `hv-core` produced the exact expected accounting witness (Arc 3), then deliberately executes
# `BRK #0` so the installed exception vectors catch + decode a real fault (Arc 2 — the boot-test
# asserts the decode). Off by default: the normal boot runs the Arc-3 sequence and parks. Each
# self-test asserts a witness produced *by* the mechanism under test (design-lesson #24(f)). See
# `src/exceptions.rs` and `rust_main`.
selftest = []

# `wx-probe` builds the **W^X witness** for EL2's own stage-1 mapping (ledger item 5): after the MMU
# is on, store to EL2's `.text` and require the hardware to refuse. A separate binary rather than a
# runtime branch because the fault is TERMINAL — vector 4 reports and halts by design — so this boot
# ENDS in a fault, and its expected transcript is not the normal one.
#
# ★ The negative control needs no build of its own: with the MMU off, which is every build before
# that rung, the same store succeeds silently. Removing the fix is what the whole history already did.
wx-probe = []

# `no-irq-confinement` is ⑱-7's REMOVE-THE-FIX probe: the SGI and IROUTER delivery loops HONOUR a
# match against a peer guest's vCPU instead of refusing it. That is not a contrived mutation — a
# peer's vCPU genuinely has the same affinity (`vcpu_affinity` takes no guest argument), so the match
# is real on every boot and only the guest bound refuses it. The victim guest's own `/proc/interrupts`
# reports the difference. Run by hand; the measured result is in `docs/INTERRUPT-CONFINEMENT.md`.
no-irq-confinement = []

# `spi-route-probe` is ⑱-6's REMOVE-THE-FIX probe: `deliver_spi` ignores `GICD_IROUTER` and puts the
# SPI wherever the pCPU happens to be — the pre-⑱-6 behaviour, restored on purpose. It is a probe
# rather than a permanent gate configuration because it costs a whole real-Linux boot (~40 s) to
# reproduce a result that is stable and tabulated in `docs/VGIC-SPI-ROUTING.md`; the property it
# kills is guarded on every gate run by the `baleen: vspi FAIL` forbidden marker and by the guest's
# own `baleen-spi-counts:` line, both of which this probe flips.
spi-route-probe = []

# `xn-probe` is the OTHER half of W^X: jump into EL2's own data and require the hardware to refuse.
# Separate from `wx-probe` because both faults are terminal — vector 4 reports and halts — so only
# one can run per boot. Two configurations, not two phases.
xn-probe = []

# `smmu` builds the SMMU **default-deny** boot (the SMMU arc, rungs 1–2: `GBPA.ABORT` before any bus
# master exists, then a stream table whose every entry denies, and the five-phase witness that the
# device really does reach it). It is a separate binary rather
# than a runtime probe for a concrete reason: reading the SMMUv3 register window on a machine QEMU
# started WITHOUT `iommu=smmuv3` takes a synchronous external abort (unassigned MMIO on `virt` faults,
# it does not read as zero — measured, after assuming otherwise), and EL2's fault handler is `-> !` by
# design ("Arc 2 does not resume faults"). Making the probe survivable would mean putting a resumable
# fault path into the exception vectors for a diagnostic's benefit — new risk in a load-bearing path.
# So the boot that touches SMMU registers is the one only ever launched on a machine that has an SMMU.
# The DMA half of the witness is shared code across both boots; only the SMMU setup is gated.
smmu = []

# `real-linux` (M5 Arc 5e) replaces the synthetic guest phases with the real-Linux capstone: boot an
# actual aarch64 Linux kernel as a single EL1 guest that owns the machine (device pass-through,
# `HCR_EL2.IMO=0`). Off by default — the default build (what the CI boot-test asserts on) runs the
# synthetic Arc 0–5 guests unchanged. Driven by `cargo xtask qemu-linux`, which loads a kernel
# `Image` + initramfs + DTB via QEMU `-device loader`. NO isolation content (the thesis is proven on
# the synthetic guests); this only demonstrates the proven interface carries an unmodified kernel.
real-linux = []

# The proven brain and the fence it speaks to, linked across the workspace boundary as path deps
# (both are members of the parent workspace; hv-metal is its own excluded workspace). They build
# under their own manifests — i.e. still `unsafe_code = "forbid"`, still proven — so linking them
# here does not pierce the fence. hv-metal supplies the `#[global_allocator]` (see `src/heap.rs`)
# that `hv-core`'s `alloc` use needs on the metal.
[dependencies]
hv-core = { path = "../hv-core" }
hv-hal = { path = "../hv-hal" }
# The Stage-2 emission, factored OUT of this crate's `unsafe` (see `src/stage2.rs`): `hv-s2` decides
# which frames a domain reaches and encodes the descriptors, as pure zero-`unsafe` code under the
# workspace fence; hv-metal keeps only the publish (barriers + TLB maintenance + VTTBR).
hv-s2 = { path = "../hv-s2" }
# How this machine is PARTITIONED among guest slots (㉒). The slot-indexed arithmetic used to
# live here, guarded by `const assert!`s at the two slots the board deploys; under the fence the same
# `const fn`s are proven for a symbolic partition. This crate keeps the DEPLOYMENT — which numbers go
# in — and asserts the shipped instance against the very predicates `hv-verify` proved total.
hv-part = { path = "../hv-part" }
# The emulated device models the guest drives, factored OUT of this crate for the same reason
# `hv-s2` was (⑯): `hv-metal` is workspace-EXCLUDED, so nothing here can be reached by `hv-verify`.
# Under the fence the register files are pure, provable code; what stays here is the deployment —
# the addresses, the `const assert!`s binding a model to this board, the hardware pokes and the
# boot witnesses.
hv-vdev = { path = "../hv-vdev" }

# Standalone: its own workspace so the parent's stable `cargo test --workspace` never tries to
# build this bare-metal binary (it targets `aarch64-unknown-none-softfloat` and would fail on the
# host). The parent `Cargo.toml` also lists this dir under `exclude`. Mirrors how `hv-fuzz` is kept
# out of the stable build.
[workspace]

# This is the ONE crate that overrides the workspace-wide `unsafe_code = "forbid"` fence. The metal
# layer IS the thin fenced `unsafe` core — MMIO, system registers, page tables. Everything above it
# (`hv-core`) stays `unsafe`-free and proven; every `unsafe` block here is justified against the
# `hv-hal` fence the proofs assume (see Architecture Audit #1 in `docs/ROADMAP.md`).
[lints.rust]
unsafe_code = "allow"

# Bare-metal: no unwinding.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
