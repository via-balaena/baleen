[package]
name = "hv-core"
description = "All hypervisor logic as a no_std library: hypercall dispatch and state machines, zero unsafe."
# Internal workspace crate — not for crates.io. Guards against an accidental publish.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
hv-hal = { path = "../hv-hal" }

[features]
# Opt-in, nightly-only: enables `#![feature(variant_count)]` so a test can mechanically prove
# `HVCALL_VARIANT_COUNT` equals the true number of `HvCall` variants (`core::mem::variant_count`).
# Kept off by default and out of the stable build, so the verified core carries ZERO external
# dependencies and no proc-macro toolchain. The dedicated nightly CI job turns this on; see the
# `HVCALL_VARIANT_COUNT` docs and `.github/workflows/ci.yml`.
variant_count_check = []

[lints]
workspace = true
