[package]
name = "hv-core"
description = "All hypervisor logic as a no_std library: hypercall dispatch and state machines, zero unsafe."
# Internal workspace crate — not for crates.io. Guards against an accidental publish.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
hv-hal = { path = "../hv-hal" }
# The verified core's sole external dependency. `strum`'s `EnumCount` derive gives a
# compiler-maintained count of `HvCall` variants (`HVCALL_VARIANT_COUNT`), which `hv-sim`'s
# transition-list-completeness census uses to catch a variant added but never wired into the
# ∀-N sweep. `default-features = false` keeps it `no_std`; only the derive feature is pulled.
strum = { version = "0.26", default-features = false, features = ["derive"] }

[lints]
workspace = true
